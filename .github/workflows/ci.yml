name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - run: python -m pip install -e '.[dev]'

      - name: ruff
        run: |
          ruff check .
          ruff format --check .

      - name: mypy
        run: mypy

      - name: pytest
        run: python -m pytest -q

  image:
    # The image as a user runs it: unprivileged, scanning a folder mounted
    # read-only, with no network.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: build
        run: docker build -t vulnscan:local .

      - name: smoke test
        run: ./scripts/smoke.sh vulnscan:local
