[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnscan"
version = "0.1.0"
description = "A defensive scanner for my own repositories: vulnerable dependencies, committed secrets, risky container settings"
requires-python = ">=3.14"
license = "MIT"
# No runtime dependencies yet: the standard library reads TOML, JSON and
# the file tree.
dependencies = []

[project.optional-dependencies]
dev = [
  "hypothesis>=6.140",
  # References for hand-written code, used only by tests: version ordering,
  # CVSS scores, and the SARIF schema check.
  "packaging>=26.3",
  "semver>=3.1",
  "cvss>=3.6",
  "jsonschema>=4.26",
  "mypy>=2.4",
  "pytest>=9.1",
  "ruff>=0.16",
]

[project.scripts]
vulnscan = "vulnscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Test the working tree, not whatever copy happens to be installed in the venv.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
# E/F: pycodestyle and pyflakes. I: import order. B: likely bugs.
# UP: modern syntax for the target version.
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# tests/helpers.py, imported by the tests as a module of their own.
known-local-folder = ["helpers"]

[tool.mypy]
strict = true
files = ["src", "tests"]

# The test-only references ship without type information.
[[tool.mypy.overrides]]
module = ["cvss", "cvss.*", "jsonschema"]
ignore_missing_imports = true
